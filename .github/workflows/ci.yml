name: CI

on:
  push:
  pull_request:

jobs:
  statistical-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Compile released Python code
        run: python -m compileall -q code external_validation figures
      - name: Run dependency-light released tests
        working-directory: code
        run: pytest -q test_stats_core.py test_baselines.py -k 'not scores_shape_and_range'
