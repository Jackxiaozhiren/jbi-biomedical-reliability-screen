name: CI

on:
  push:
  pull_request:

jobs:
  statistical-core:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Compile released Python code
        run: python -m compileall -q code external_validation figures
      - name: Run dependency-light released tests
        working-directory: code
        run: pytest -q test_stats_core.py test_baselines.py -k 'not scores_shape_and_range'
      - name: Generate candidate release manifest
        run: python code/generate_release_manifest.py > /tmp/release-manifest.sha256
      - name: Upload candidate release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-candidate
          path: /tmp/release-manifest.sha256
          if-no-files-found: error
          retention-days: 1
